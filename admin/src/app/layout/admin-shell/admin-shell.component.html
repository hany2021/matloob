<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <strong>مطلوب</strong>
      <span class="muted">الإدارة</span>
    </div>
    <nav class="nav">
      @for (item of visibleNav(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link"
        >
          <span class="icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="spacer"></div>
      <div class="user">
        @if (auth.userName(); as name) {
          <span>{{ name }}</span>
        } @else if (auth.userEmail(); as email) {
          <span>{{ email }}</span>
        } @else {
          <span class="muted">مسجّل الدخول</span>
        }
        @if (auth.isAdmin()) {
          <span class="badge badge-info">مشرف</span>
        }
        <button type="button" class="btn btn-ghost" (click)="logout()">
          تسجيل الخروج
        </button>
      </div>
    </header>
    <main class="outlet">
      <router-outlet />
    </main>
  </div>
</div>
