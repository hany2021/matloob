<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <strong>Matloob</strong>
      <span class="muted">Admin</span>
    </div>
    <nav class="nav">
      @for (item of visibleNav(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link"
        >
          <span class="icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="spacer">
        @if (profileService.establishments().length > 1) {
          <label class="establishment-picker">
            <span class="muted">Acting as</span>
            <select
              [value]="profileService.activeEstablishmentId() ?? ''"
              (change)="onEstablishmentChange($event)"
            >
              @for (e of profileService.establishments(); track e.id) {
                <option [value]="e.id">{{ e.name }}</option>
              }
            </select>
          </label>
        }
      </div>
      <div class="user">
        @if (auth.userName(); as name) {
          <span>{{ name }}</span>
        } @else if (auth.userEmail(); as email) {
          <span>{{ email }}</span>
        } @else {
          <span class="muted">Signed in</span>
        }
        @if (auth.isAdmin()) {
          <span class="badge badge-info">admin</span>
        }
        <button type="button" class="btn btn-ghost" (click)="logout()">
          Sign out
        </button>
      </div>
    </header>
    <main class="outlet">
      <router-outlet />
    </main>
  </div>
</div>
